[build]
  command = "python3 build.py"
  publish = "dist"

# Netlify's build image ships Python 3.8 by default; build.py is 3.8-compatible.
# Optional variables (set in Site configuration > Environment variables):
#   FLOWSEARCH_VERIFICATION_TOKEN  token from the FlowSearch dashboard
#   FLOWSEARCH_APP_URL             origin serving widget.js / results.js
#   FLOWSEARCH_API_KEY             the website's fs_... key
# SITE_URL is taken from Netlify's built-in URL variable when not set.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
